<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Conselho de Classe | CEEINFOR Mãe Stella</title>
    <meta name="robots" content="noindex, nofollow">

    

    <style>
        * {
            margin: 0 !important;
            padding: 0 !important;
            box-sizing: border-box !important;
        }

        html, body {
            width: 100vw !important;
            height: 100vh !important;
            overflow: hidden !important; /* Trava qualquer rolagem da casca externa */
            background-color: #052442;
        }

        .iframe-crop-container {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            overflow: hidden !important; /* Corta tudo que ultrapassar o topo */
        }

        /* Desloca 60px para cima com segurança e compensa a altura */
        .iframe-crop-container iframe {
            position: absolute !important;
            top: -60px !important; /* Joga a barra do Apps Script totalmente para fora */
            left: 0 !important;
            width: 100% !important;
            height: calc(100% + 60px) !important; /* Compensa os 60px na base */
            border: 0 !important;
            display: block !important;
        }
    </style>
</head>
<body>

    <div class="iframe-crop-container">
        <iframe 
            class="app-frame"
            src="https://script.google.com/macros/s/AKfycbxqAg9Wh2Rhng0IQuyaxvHV7Ng-W2BQsWnR-xylpl-6Ri9uRcwoUk0ea01XnOBFR-W0/exec"
            allow="fullscreen; camera; microphone; clipboard-write; geolocation"
            loading="eager">
        </iframe>
    </div>
</body>
</html>
