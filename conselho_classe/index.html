<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Conselho de Classe | CEEINFOR Mãe Stella</title>
    <meta name="robots" content="noindex, nofollow">

    <!-- Google Analytics 4 (Mesmo ID institucional) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-GF1QQBE4W0"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-GF1QQBE4W0', {
        page_title: 'Conselho de Classe',
        page_path: '/conselho_classe'
      });
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* Iframe em tela cheia ocupando 100% do navegador sem bordas */
        .app-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            margin-top: -01px;          /* Empurra o banner para fora da visão */
            display: block;
        }

        /* Tela de carregamento enquanto o Apps Script inicializa */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            z-index: -1;
            color: #052442;
        }

        .spinner {
            width: 42px;
            height: 42px;
            border: 4px solid #e2e8f0;
            border-top-color: #ffc107;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="loading-overlay">
        <div class="spinner"></div>
        <p>Carregando Sistema do Conselho de Classe...</p>
    </div>

    <iframe 
        class="app-frame"
        src="https://script.google.com/macros/s/AKfycbxqAg9Wh2Rhng0IQuyaxvHV7Ng-W2BQsWnR-xylpl-6Ri9uRcwoUk0ea01XnOBFR-W0/exec"
        allow="fullscreen; camera; microphone; clipboard-write; geolocation"
        loading="eager">
    </iframe>

</body>
</html>
