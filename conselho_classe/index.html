    <style>
    * {
        margin: 0;
        padding: 0;

    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden; /* Corta qualquer conteúdo que saia da tela */
        background-color: #052442; /* Ou a cor de fundo do seu tema */
    }

    /* Envoltório que esconde o que passar dos limites da janela */
    .iframe-wrapper {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
    }

    /* Iframe empurrado para cima para jogar a faixa para fora da visão */
    .app-frame {
        position: absolute;
        left: 0;
        width: 100%;
        border: none;
        
        /* A faixa tem cerca de 45px a 50px de altura */
        top: -46px; 
        height: calc(100% + 46px);
    }
</style>

<body>
    <div class="iframe-wrapper">
